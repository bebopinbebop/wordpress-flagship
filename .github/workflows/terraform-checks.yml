name: Terraform Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  terraform:
    name: Terraform and Script Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Bash syntax check
        run: |
          bash -n scripts/*.sh

      - name: Verify no committed local Terraform variables or state
        run: |
          test ! -f terraform/environments/dev-lite/terraform.tfvars
          test ! -f terraform/environments/dev-lite/terraform.tfstate
          test ! -f terraform/environments/dev-rds/terraform.tfvars
          test ! -f terraform/environments/dev-rds/terraform.tfstate

