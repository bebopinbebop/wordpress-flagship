name: Terraform Checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Terraform and Script Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Bash syntax check
        run: |
          bash -n scripts/*.sh

      - name: Verify no committed local Terraform variables or state
        run: |
          if git ls-files terraform/environments | grep -E '(^|/)(terraform\.tfvars|terraform\.tfvars\.json|terraform\.tfstate|terraform\.tfstate\.backup)$'; then
            echo "Terraform state or local variable files must not be committed."
            exit 1
          fi

  validate:
    name: Validate ${{ matrix.environment }}
    runs-on: ubuntu-latest
    needs: quality

    strategy:
      fail-fast: false
      matrix:
        environment:
          - wp-lite
          - wp-rds
          - wp-mig

    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate
